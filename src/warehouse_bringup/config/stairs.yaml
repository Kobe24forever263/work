  # laser cross-floor leakage through internal shafts while preserving continuous geometry.
  STAIR_NE: {dog_id: dog_1, floor1_xy: [20.091, 17.091], floor2_xy: [15.0, 12.0], state: FREE, queue_length: 0, risk: 0.05}
  STAIR_NW: {dog_id: dog_2, floor1_xy: [-20.091, 17.091], floor2_xy: [-15.0, 12.0], state: FREE, queue_length: 0, risk: 0.05}
  STAIR_SW: {dog_id: dog_3, floor1_xy: [-20.091, -17.091], floor2_xy: [-15.0, -12.0], state: FREE, queue_length: 0, risk: 0.05}
  STAIR_SE: {dog_id: dog_4, floor1_xy: [20.091, -17.091], floor2_xy: [15.0, -12.0], state: FREE, queue_length: 0, risk: 0.05}
