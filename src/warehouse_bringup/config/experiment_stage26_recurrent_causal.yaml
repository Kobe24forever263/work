protocol:
  version: warehouse_stage26_recurrent_causal_v1
  date: '2026-09-03'
  status: LOCKED_CONTROLS_COMPLETE_MEMORY_CLAIM_REJECTED
  purpose: >-
    Add episode-scoped GRU memory to the strict released-only causal policy
    after the Stage 25 feed-forward sentinel failed contextual switching.

claim_boundary:
  decision_process: CAUSAL_PARTIALLY_OBSERVED_SMDP
  policy_observation: CAUSAL_RELEASED_V4
  visibility: RELEASED_ONLY
  future_task_information_visible: false
  realised_active_completion_visible: false
  stage25_frozen_sources_modified: false

environment:
  execution_mode: CONCURRENT
  arrival_profile: MIXED_CURRICULUM
  tasks_per_episode: 80
  state_reset_between_phases: false
  handover_sampling: TASK_KEYED
  reward_contract: CONTINUOUS_TIME_V3
  discount_mode: VARIABLE_SMDP
  trace_mode: DURATION_SCALED
  trace_tau_s: 10.0
  transport_modes:
    - SINGLE_CAR
    - SINGLE_DOG
    - CAR_DOG_CAR

model:
  architecture: recurrent_contextual_masked_candidate_actor_critic_v1
  policy_variant: RECURRENT_CONTEXT_INTERACTION
  state_width: 1720
  action_width: 30
  hidden_width: 96
  recurrent_cell: GRUCell
  memory_width: 96
  memory_reset_boundary: EPISODE
  recurrent_training_contract: FULL_EPISODE_BPTT
  index_specific_parameters: false

ppo:
  updates: 2000
  episodes_per_update: 4
  episodes_per_seed: 8000
  ppo_epochs: 4
  learning_rate: 0.0003
  clip_ratio: 0.2
  gae_lambda: 0.95
  entropy_coefficient: 0.01
  value_coefficient: 0.5
  reward_normalization: reverse_variable_discounted_return_to_go_std_v2
  evaluation_every_updates: 100
  checkpoint_every_updates: 100
  progress_log_every_updates: 20

cohort:
  sentinel_seed_index: 1
  independent_training_base_seeds:
    - 73010000
    - 73020000
    - 73030000
    - 73040000
    - 73050000
    - 73060000
    - 73070000
    - 73080000
    - 73090000
    - 73100000
  expansion_rule: >-
    Train seed 01 manually. Seeds 02-10 remain blocked until fresh-seed
    safety, contextual switching, and reward gates pass.

validation:
  online_validation_seed_start: 73250000
  online_validation_episode_count: 40
  formal_locked_seed_start: 73350000
  formal_locked_seed_count: 100
  formal_locked_test_status: COMPLETE_FROZEN_TEN_SEED_COHORT
  sentinel_quality_gate:
    required:
      - zero_illegal_actions
      - zero_resource_leaks
      - all_tasks_resolved
      - finite_training_metrics
      - recurrent_memory_changes
      - all_three_transport_modes_exposed
      - contextual_switching_gate_passed
      - fresh_seed_mean_reward_not_below_rule_baseline

manual_execution:
  required: true
  automatic_long_training_forbidden: true
  sentinel_command: >-
    /Users/lab4099/Desktop/Mujoco/task2_handover/.pixi/envs/default/bin/python
    scripts/run_stage26_recurrent_long.py 1 --execute --confirm-long
  resume_command: >-
    /Users/lab4099/Desktop/Mujoco/task2_handover/.pixi/envs/default/bin/python
    scripts/run_stage26_recurrent_long.py 1 --resume-latest --execute
    --confirm-long
  sentinel_weight: >-
    results/stage26_recurrent_causal/long/seed_01/stage26_recurrent_ppo.pt
