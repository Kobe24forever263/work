scan_planner_node:
  ros__parameters:
    fsm.planning_horizon: 5.0
    manager.planning_horizon: 5.0
    fsm.thresh_replan: 0.8
    fsm.thresh_no_replan: 0.22
    fsm.max_replan_fail_count: 1000

    grid_map.sliding_map_size_x: 10.0
    grid_map.sliding_map_size_y: 10.0
    grid_map.sliding_map_size_z: 3.0
    grid_map.local_update_range_x: 5.0
    grid_map.local_update_range_y: 5.0
    grid_map.local_update_range_z: 1.5
    grid_map.double_cylinder_radius: 0.32
    grid_map.double_cylinder_offset: 0.20
    grid_map.body_height: 0.42

    manager.max_vel: 2.0
    manager.max_acc: 1.0
    optimization.max_vel: 2.0
    optimization.max_acc: 1.0
    optimization.lambda_smooth: 4.0
    optimization.lambda_fitness: 8.0
    optimization.lambda_collision: 1.5
    optimization.dist0: 0.25
